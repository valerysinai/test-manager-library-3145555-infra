worker_processes auto;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server {
        listen 8080;
        location = /health { return 200 'ok'; }
        location / { return 404; }
    }
    server {
        listen 443 ssl;
        server_name localhost gateway;
        ssl_certificate /etc/library/tls/certificate.pem;
        ssl_certificate_key /etc/library/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 8m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        error_page 413 =422 /too-large;
        location = /too-large {
            internal;
            default_type application/json;
            return 422 '{"code":"VALIDATION_ERROR","message":"El archivo supera el tamaño permitido.","details":[]}';
        }
        location /api/v1/ {
            set $api_upstream api:8000;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }
        location / {
            set $app_upstream app:80;
            proxy_pass http://$app_upstream;
            proxy_set_header Host $http_host;
        }
    }
}
