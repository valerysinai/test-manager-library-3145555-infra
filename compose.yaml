name: manager-library

x-api-build: &api-build
  context: ${API_CONTEXT:-../test-manager-library-3145555-api}
  target: application

x-database-environment: &database-environment
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: "false"
  LOG_CHANNEL: stderr
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-library}
  DB_USERNAME: ${DB_USERNAME:-library}
  DB_PASSWORD: ${DB_PASSWORD:?Generate local configuration first}
  DB_SEARCH_PATH: library
  TZ: UTC

services:
  db:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_DB: ${DB_DATABASE:-library}
      POSTGRES_USER: ${DB_USERNAME:-library}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate local configuration first}
      TZ: UTC
      PGTZ: UTC
    command: [postgres, -c, timezone=UTC]
    volumes:
      - database:/var/lib/postgresql/data
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    image: manager-library-api:${IMAGE_TAG:-local}
    build: *api-build
    environment: *database-environment
    command: [php, artisan, migrate, --force, --no-interaction]
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: manager-library-api:${IMAGE_TAG:-local}
    build: *api-build
    environment:
      <<: *database-environment
      APP_URL: ${PUBLIC_ORIGIN:-https://localhost:8443}
      JWT_SECRET: ${JWT_SECRET:?Generate local configuration first}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Generate local configuration first}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Generate local configuration first}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-https://localhost:8443}
      COVERS_DIR: /app/storage/app/private/covers
      CLOCK_MODE: ${CLOCK_MODE:-system}
      CLOCK_FIXED_AT: ${CLOCK_FIXED_AT:-}
    volumes:
      - covers:/app/storage/app/private/covers
    networks: [data, services]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  app:
    image: manager-library-app:${IMAGE_TAG:-local}
    build:
      context: ${APP_CONTEXT:-../test-manager-library-3145555-app}
      target: application
      args:
        VITE_API_BASE_URL: /api/v1
    networks: [services]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    image: nginx:stable-alpine@sha256:c36c74649f425d29473146f051ab9a032874a6989942557acb8ab1e215c6c2d8
    ports:
      - "127.0.0.1:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: ${TLS_DIR:-./.local/tls}/certificate.pem
        target: /etc/library/tls/certificate.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_DIR:-./.local/tls}/key.pem
        target: /etc/library/tls/key.pem
        read_only: true
        bind:
          create_host_path: false
    networks: [services, edge]
    depends_on:
      api:
        condition: service_healthy
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  data:
    internal: true
  services:
    internal: true
  edge: {}

volumes:
  database: {}
  covers: {}
